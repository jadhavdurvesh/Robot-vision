calibration:
  path: calibration/camera.json

camera:
  width: 1280
  height: 720
  fps: 30
  reconnect_delay_seconds: 1.0

detection:
  model: yolo11s.pt
  confidence: 0.20
  iou: 0.50
  device: auto
  imgsz: 640
  half: true

obstacle_map:
  roi_top_ratio: 0.38
  obstacle_padding_px: 18
  obstacle_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - train
    - chair
    - couch
    - bed
    - dining table
    - potted plant
    - suitcase
    - backpack
    - handbag
    - bench
    - skateboard
    - snowboard
    - sports ball
    - dog
    - cat
    - bicycle
    - motorcycle
    - tv
    - laptop
    - microwave
    - oven
    - refrigerator

planner:
  corridor_bottom_ratio: 0.96
  corridor_top_ratio: 0.52
  lateral_samples: 31
  lookahead_ratio: 0.72
  safety_margin_px: 10

runtime:
  adaptive_detection: true
  static_motion_threshold: 0.012
  static_detection_interval: 3
  motion_resize: 160

depth:
  enabled: true
  model: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
  device: auto
  interval: 5
  input_width: 384

odometry:
  enabled: true
  interval: 2
  input_width: 480
  max_features: 700
  min_matches: 24
  min_inliers: 12

mapping:
  enabled: true
  size: 320
  meters_per_cell: 0.05
  decay: 0.997
  update_interval: 3

point_cloud:
  enabled: true
  max_points: 50000
  sample_step: 12
  max_depth: 6.0

navigation:
  enabled: true
  size: 160
  cell_size: 0.05
  obstacle_radius: 3

world_navigation:
  enabled: true
  size: 320
  meters_per_cell: 0.05
  decay: 0.995
  max_range: 7.0
