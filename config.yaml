camera:
  width: 1280
  height: 720
  fps: 30
  reconnect_delay_seconds: 1.0

detection:
  model: yolo11s.pt
  confidence: 0.20
  iou: 0.50
  device: auto
  imgsz: 640
  half: true

obstacle_map:
  roi_top_ratio: 0.38
  obstacle_padding_px: 18
  obstacle_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - train
    - chair
    - couch
    - bed
    - dining table
    - potted plant
    - suitcase
    - backpack
    - handbag
    - bench
    - skateboard
    - snowboard
    - sports ball
    - dog
    - cat
    - bicycle
    - motorcycle
    - tv
    - laptop
    - microwave
    - oven
    - refrigerator

planner:
  corridor_bottom_ratio: 0.96
  corridor_top_ratio: 0.52
  lateral_samples: 31
  lookahead_ratio: 0.72
  safety_margin_px: 10
