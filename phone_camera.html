<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robot Vision Camera</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b10;color:#eef4f8;font-family:system-ui,sans-serif;display:flex;justify-content:center}main{width:min(100%,760px);padding:20px}h1{margin:0 0 6px;font-size:25px}p{color:#9eabb5}video{width:100%;border-radius:16px;background:#000;transform:scaleX(-1)}button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;font-weight:700;font-size:17px}#start{background:#43e07b;color:#041008}#stop{background:#252d35;color:#fff}#status{margin-top:14px;padding:12px;border-radius:10px;background:#121920}</style></head><body><main><h1>Robot Vision</h1><p>Wireless phone camera session</p><video id="camera" autoplay playsinline muted></video><button id="start">START CAMERA</button><button id="stop" disabled>STOP SESSION</button><div id="status">Disconnected</div></main><script>
const video=document.getElementById("camera"),start=document.getElementById("start"),stop=document.getElementById("stop"),status=document.getElementById("status");let stream=null,socket=null,timer=null,sending=false,canvas=document.createElement("canvas");
function setStatus(t){status.textContent=t}
async function startSession(){start.disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:15,max:20}},audio:false});video.srcObject=stream;socket=new WebSocket("wss://"+location.host+"/ws");socket.binaryType="arraybuffer";socket.onopen=()=>{stop.disabled=false;setStatus("Connected — sending camera frames");timer=setInterval(sendFrame,120)};socket.onmessage=()=>{};socket.onerror=()=>setStatus("Connection error");socket.onclose=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(timer)clearInterval(timer);stop.disabled=true;start.disabled=false;setStatus("Disconnected")}}catch(e){setStatus("Camera error: "+e.message);start.disabled=false}}
function sendFrame(){if(!socket||socket.readyState!==WebSocket.OPEN||sending||video.readyState<2)return;sending=true;canvas.width=960;canvas.height=Math.round(960*video.videoHeight/video.videoWidth);canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{sending=false;if(blob&&socket.readyState===WebSocket.OPEN)blob.arrayBuffer().then(b=>socket.send(b))},"image/jpeg",.72)}
function stopSession(){if(timer)clearInterval(timer);if(socket)socket.close();if(stream)stream.getTracks().forEach(t=>t.stop());timer=null;socket=null;stream=null;stop.disabled=true;start.disabled=false;setStatus("Stopped")}
start.onclick=startSession;stop.onclick=stopSession;</script></body></html>
